[paths]
# Relative to the script location. Change to absolute paths if needed.
data_dir    = data
chroma_dir  = vector_db
collection  = pdf_documents

[embedding]
# Runs locally — downloaded once from HuggingFace (~90 MB)
model = all-MiniLM-L6-v2

[chunking]
chunk_size     = 300
chunk_overlap  = 100
# Strategy: 'sentence' (fixed-size, overlap) or 'section' (split on headings)
chunk_strategy = section

[ollama]
model = llama3.2
top_k = 5
host  = http://localhost:11434

[pipeline]
# Number of PDF files processed per batch before saving a milestone checkpoint.
# 0 = no batching (process all files in one go without intermediate saves).
pdf_batch_size = 0
